services:
  legafetch-api:
    build: .
    image: legafetch-api:latest
    container_name: legafetch-api
    restart: unless-stopped
    mem_limit: 4000m
    memswap_limit: 4000m
    env_file: .env.production
    networks: [lexordo_default]
    volumes:
      - hf-cache:/root/.cache/huggingface
    expose: ["8000"]
    # OLCULDU 2026-09-17: Qdrant OOM ile yeniden basladiginda bu servis AYAKTA
    # kaliyor ama qdrant_client'in baglanti havuzu olu kaliyor
    # ("ResponseHandlingException: Server disconnected") ve /health 500 donuyor.
    # `restart: unless-stopped` ise yaramiyor — konteyner CIKMIYOR ki restart olsun.
    # Sonuc: bir OOM = biri elle restart edene kadar kesinti (o gun saatlerce surdu).
    # Healthcheck bu durumu "unhealthy" olarak gorunur kilar; asagidaki autoheal
    # servisi de unhealthy konteyneri yeniden baslatir.
    # Not: konteyner acilista rerank modelini yukluyor — start_period bunu bekler.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=20).status==200 else 1)\""]
      interval: 60s
      timeout: 25s
      retries: 10
      start_period: 180s
    labels:
      autoheal: "true"

  # Unhealthy isaretlenen konteynerleri yeniden baslatir. Docker'in kendisi
  # bunu YAPMAZ: `restart` politikasi yalnizca CIKAN konteyneri ilgilendirir,
  # saglik durumunu umursamaz. Yalnizca autoheal=true etiketli konteynerlere
  # dokunur (AUTOHEAL_CONTAINER_LABEL), makinedeki diger projeler guvende.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: legafetch-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "60"
      AUTOHEAL_START_PERIOD: "300"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 64m

networks:
  lexordo_default:
    external: true
volumes:
  hf-cache:
