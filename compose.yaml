# LegaFetch yigini - netcup VPS 4000 G12 (31 GB RAM, 12 vCPU, 1 TB)
# Hetzner'den tasindi 2026-09-20. Orada 15,6 GB'lik makinede Qdrant 14g
# tavaniyla host'u dibe cekiyordu; burada tek is bu, tavan 24g.
services:
  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: legafetch-qdrant
    restart: unless-stopped
    mem_limit: 24g
    environment:
      QDRANT__STORAGE__MMAP_THRESHOLD_KB: "262144"
      QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS: "8"
      QDRANT__STORAGE__PERFORMANCE__MAX_OPTIMIZATION_THREADS: "4"
    env_file: [qdrant.env]
    volumes:
      - /opt/legafetch/qdrant-storage:/qdrant/storage
      - /opt/legafetch/snapshots:/qdrant/snapshots
    ports:
      - "127.0.0.1:6333:6333"
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 300s

  api:
    build: ./api
    image: legafetch-api:latest
    container_name: legafetch-api
    restart: unless-stopped
    mem_limit: 6g
    env_file: [./api/.env.production]
    environment:
      QDRANT_URL: http://qdrant:6333
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - hf-cache:/root/.cache/huggingface
      # Gercek sorgu kaydi: asil olcum seti kullanicidan gelir, konteyner
      # yeniden yaratildiginda kaybolmamali.
      - ./api/loglar:/app/loglar
    ports:
      - "127.0.0.1:8000:8000"
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=20).status==200 else 1)\""]
      interval: 60s
      timeout: 25s
      retries: 10
      start_period: 180s

  gateway:
    build: ./gateway
    image: legafetch-gateway:latest
    container_name: legafetch-gateway
    restart: unless-stopped
    mem_limit: 256m
    environment:
      NODE_ENV: production
      PYTHON_API_URL: http://api:8000
      PORT: "3001"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3001/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  web:
    build: ./web
    image: legafetch-web:latest
    container_name: legafetch-web
    restart: unless-stopped
    mem_limit: 1g
    env_file: [./web/.env.production]
    environment:
      API_BACKEND_URL: http://gateway:3001
      COOKIE_SECURE: "1"
    depends_on:
      gateway:
        condition: service_healthy
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: legafetch-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "60"
      AUTOHEAL_START_PERIOD: "300"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 64m

  caddy:
    image: caddy:2
    container_name: legafetch-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/legafetch/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-log:/var/log/caddy
    depends_on: [gateway, web]

volumes:
  hf-cache:
  caddy-data:
  caddy-config:
  caddy-log:
